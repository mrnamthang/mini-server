---
# Laravel Project - Docker Compose Configuration
# Auto-generated by onboard-project.sh

version: '3.8'

services:
  # ===========================================================================
  # Nginx - Web Server
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: {{PROJECT_NAME}}-nginx
    restart: unless-stopped
    ports:
      - "80"
    volumes:
      - ./src:/var/www/html:delegated
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - {{PROJECT_NAME}}-internal
      - traefik-public
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"

      # HTTP Router
      - "traefik.http.routers.{{PROJECT_NAME}}-web.rule=Host(`{{DOMAIN}}`)"
      - "traefik.http.routers.{{PROJECT_NAME}}-web.entrypoints=web"
      - "traefik.http.routers.{{PROJECT_NAME}}-web.service={{PROJECT_NAME}}-web"

      # HTTPS Router (uncomment after running ./scripts/secure-local.sh)
      # - "traefik.http.routers.{{PROJECT_NAME}}-web-secure.rule=Host(`{{DOMAIN}}`)"
      # - "traefik.http.routers.{{PROJECT_NAME}}-web-secure.entrypoints=websecure"
      # - "traefik.http.routers.{{PROJECT_NAME}}-web-secure.tls=true"
      # - "traefik.http.routers.{{PROJECT_NAME}}-web-secure.service={{PROJECT_NAME}}-web"

      # Service
      - "traefik.http.services.{{PROJECT_NAME}}-web.loadbalancer.server.port=80"

  # ===========================================================================
  # PHP-FPM - Laravel Application
  # ===========================================================================
  app:
    build:
      context: ./src
      dockerfile: ../Dockerfile
      args:
        - PHP_VERSION={{PHP_VERSION}}
    image: {{PROJECT_NAME}}-app:latest
    container_name: {{PROJECT_NAME}}-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html:delegated
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=https://{{DOMAIN}}
      - DB_CONNECTION={{DB_TYPE}}
      - DB_HOST={{PROJECT_NAME}}-db
      - DB_PORT={{DB_PORT}}
      - DB_DATABASE=${DB_DATABASE:-{{PROJECT_NAME}}}
      - DB_USERNAME=${DB_USERNAME:-{{PROJECT_NAME}}}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST={{PROJECT_NAME}}-redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - {{PROJECT_NAME}}-internal
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Database - MySQL or PostgreSQL
  # ===========================================================================
  db:
    image: {{DB_IMAGE}}
    container_name: {{PROJECT_NAME}}-db
    restart: unless-stopped
    environment:
      {{DB_ENV_VARS}}
    volumes:
      - {{PROJECT_NAME}}-db-data:/var/lib/{{DB_DATA_PATH}}
    networks:
      - {{PROJECT_NAME}}-internal
    healthcheck:
      test: {{DB_HEALTHCHECK}}
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Redis - Cache & Queue
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: {{PROJECT_NAME}}-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - {{PROJECT_NAME}}-redis-data:/data
    networks:
      - {{PROJECT_NAME}}-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Queue Worker (Optional - uncomment if using queues)
  # ===========================================================================
  # queue:
  #   build:
  #     context: ./src
  #     dockerfile: ../Dockerfile
  #   container_name: {{PROJECT_NAME}}-queue
  #   restart: unless-stopped
  #   working_dir: /var/www/html
  #   volumes:
  #     - ./src:/var/www/html:delegated
  #   command: php artisan queue:work --sleep=3 --tries=3
  #   depends_on:
  #     - app
  #     - redis
  #   networks:
  #     - {{PROJECT_NAME}}-internal

volumes:
  {{PROJECT_NAME}}-db-data:
    driver: local
  {{PROJECT_NAME}}-redis-data:
    driver: local

networks:
  {{PROJECT_NAME}}-internal:
    driver: bridge
  traefik-public:
    external: true
