services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: tradewhispr-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradewhispr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradewhispr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tradewhispr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Changed to 5433 to avoid conflict with local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradewhispr}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradewhispr-network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: tradewhispr-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"  # Changed to 6380 to avoid conflict with other project
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradewhispr-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradewhispr-backend
    environment:
      # App settings
      APP_NAME: ${APP_NAME:-TradeWhispr}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEBUG: ${DEBUG:-true}

      # Security
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this-in-production}

      # Database
      POSTGRES_USER: ${POSTGRES_USER:-tradewhispr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradewhispr_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tradewhispr}

      # Redis
      REDIS_URL: redis://redis:6379/0

      # CORS
      CORS_ORIGINS: '["http://localhost:5174", "http://localhost:5173", "http://localhost:3000", "http://localhost:80", "http://tradewhispr.local", "http://api.tradewhispr.local"]'

      # Disable vnai telemetry to avoid circular import
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"  # Changed to 8001 to avoid conflict with other project
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - tradewhispr-network

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradewhispr-celery-worker
    environment:
      # Database
      POSTGRES_USER: ${POSTGRES_USER:-tradewhispr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradewhispr_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tradewhispr}

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Security
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this-in-production}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks worker --loglevel=info
    networks:
      - tradewhispr-network

  # Vue 3 Frontend (Development mode with Vite)
  frontend-dev:
    image: node:20-alpine
    container_name: tradewhispr-frontend-dev
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://api.tradewhispr.local
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"  # Changed to 5174 to avoid conflict with other Vite apps
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    networks:
      - tradewhispr-network
    profiles:
      - dev

  # Vue 3 Frontend (Production mode with Nginx)
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradewhispr-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tradewhispr-network
    profiles:
      - prod

volumes:
  postgres_data:
  redis_data:

networks:
  tradewhispr-network:
    driver: bridge
