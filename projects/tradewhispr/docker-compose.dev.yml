# Generated for Asus dev server
# This file adds Traefik routing for local .local domains
# Gitignored - not needed in production

services:
  tradewhispr-backend:
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tradewhispr-backend.rule=Host(`tradewhispr.local`) || Host(`api.tradewhispr.local`)"
      - "traefik.http.routers.tradewhispr-backend.entrypoints=web"
      - "traefik.http.services.tradewhispr-backend.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik-public"

  tradewhispr-frontend:
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tradewhispr-frontend.rule=Host(`tradewhispr.local`)"
      - "traefik.http.routers.tradewhispr-frontend.entrypoints=web"
      - "traefik.http.services.tradewhispr-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-public"

networks:
  traefik-public:
    external: true
