# Generated by onboard-project.sh for Asus dev server
# This file adds Traefik routing for local .local domains

services:
  backend:
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # HTTPS router
      - "traefik.http.routers.tradewhispr-backend.rule=Host(`api.tradewhispr.local`)"
      - "traefik.http.routers.tradewhispr-backend.entrypoints=websecure"
      - "traefik.http.routers.tradewhispr-backend.tls=true"
      - "traefik.http.routers.tradewhispr-backend.middlewares=security-headers"
      - "traefik.http.services.tradewhispr-backend.loadbalancer.server.port=8000"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.tradewhispr-backend-http.rule=Host(`api.tradewhispr.local`)"
      - "traefik.http.routers.tradewhispr-backend-http.entrypoints=web"
      - "traefik.http.routers.tradewhispr-backend-http.middlewares=redirect-to-https"
      # Middlewares
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"

  frontend-dev:
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # HTTPS router
      - "traefik.http.routers.tradewhispr-frontend.rule=Host(`tradewhispr.local`)"
      - "traefik.http.routers.tradewhispr-frontend.entrypoints=websecure"
      - "traefik.http.routers.tradewhispr-frontend.tls=true"
      - "traefik.http.routers.tradewhispr-frontend.middlewares=security-headers"
      - "traefik.http.services.tradewhispr-frontend.loadbalancer.server.port=5173"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.tradewhispr-frontend-http.rule=Host(`tradewhispr.local`)"
      - "traefik.http.routers.tradewhispr-frontend-http.entrypoints=web"
      - "traefik.http.routers.tradewhispr-frontend-http.middlewares=redirect-to-https"

  frontend-prod:
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # HTTPS router
      - "traefik.http.routers.tradewhispr-frontend-prod.rule=Host(`tradewhispr.local`)"
      - "traefik.http.routers.tradewhispr-frontend-prod.entrypoints=websecure"
      - "traefik.http.routers.tradewhispr-frontend-prod.tls=true"
      - "traefik.http.routers.tradewhispr-frontend-prod.middlewares=security-headers"
      - "traefik.http.services.tradewhispr-frontend-prod.loadbalancer.server.port=80"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.tradewhispr-frontend-prod-http.rule=Host(`tradewhispr.local`)"
      - "traefik.http.routers.tradewhispr-frontend-prod-http.entrypoints=web"
      - "traefik.http.routers.tradewhispr-frontend-prod-http.middlewares=redirect-to-https"

networks:
  traefik-public:
    external: true
