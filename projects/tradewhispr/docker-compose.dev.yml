      - "traefik.docker.network=traefik-public"

  frontend-prod:
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tradewhispr-frontend-prod.rule=Host(`tradewhispr.local`)"
      - "traefik.http.routers.tradewhispr-frontend-prod.entrypoints=web"
