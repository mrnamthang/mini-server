---
# Mini Server Inventory
# Configure your Asus server details here

all:
  children:
    mini_servers:
      hosts:
        asus-server:
          # REQUIRED: Replace with your Asus server IP address
          ansible_host: 192.168.1.100  # CHANGE THIS

          # REQUIRED: Replace with your username on the Asus server
          ansible_user: your-username  # CHANGE THIS

          # Python interpreter (Ubuntu 22.04 uses python3)
          ansible_python_interpreter: /usr/bin/python3

          # Connection settings
          ansible_connection: ssh
          ansible_port: 22

          # Server-specific variables
          server_hostname: asus-mini-server
          server_timezone: America/Los_Angeles  # Adjust to your timezone

          # Resource allocation
          docker_max_concurrent_builds: 2

      vars:
        # Group variables for all mini servers
        ansible_become: true
        ansible_become_method: sudo
